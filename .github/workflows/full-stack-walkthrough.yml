name: Nexora Full-Stack Walkthrough

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/walkthrough/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-journey:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out the frontend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend security checks
        run: npm run test:security

      - name: Build frontend against the local API
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development

      - name: Fetch the backend repository
        run: git clone --depth 1 https://github.com/faizansaiyed123/Nexora-backend.git Nexora-backend

      - name: Set up Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and browser dependencies
        working-directory: Nexora-backend
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python aiosmtpd
          uv run --python 3.12 playwright install --with-deps chromium

      - name: Run backend PostgreSQL integration tests
        working-directory: Nexora-backend
        run: |
          uv run --python 3.12 alembic upgrade head
          uv run --python 3.12 pytest -q
        env:
          JWT_SECRET_KEY: nexora-ci-only-secret-with-at-least-32-characters
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexora
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: development
          EMAIL_VERIFICATION_BYPASS: "true"
          RATE_LIMIT_LOGIN_PER_MINUTE: "100"
          RATE_LIMIT_REGISTER_PER_HOUR: "100"
          RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
          RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"

      - name: Start the real API, database-backed services, and local STARTTLS inbox
        working-directory: Nexora-backend
        env:
          JWT_SECRET_KEY: nexora-ci-only-secret-with-at-least-32-characters
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexora
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: development
          EMAIL_VERIFICATION_BYPASS: "false"
          RATE_LIMIT_LOGIN_PER_MINUTE: "100"
          RATE_LIMIT_REGISTER_PER_HOUR: "100"
          RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
          RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
          SMTP_HOST: localhost
          SMTP_PORT: "2525"
          SMTP_USERNAME: nexora-ci
          SMTP_PASSWORD: nexora-ci
          SMTP_FROM_EMAIL: nexora@example.com
          SMTP_FROM_NAME: Nexora CI
          FRONTEND_URL: http://127.0.0.1:4173
          CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:5173
          ALLOWED_HOSTS: 127.0.0.1,localhost
          GEMINI_DISCOVERY_ENABLED: "false"
          AUTO_RENDER_ENABLED: "false"
          NEXORA_FRONTEND_URL: http://127.0.0.1:4173
          NEXORA_API_URL: http://127.0.0.1:8000
          NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
          NEXORA_SCREENSHOTS: ${{ github.workspace }}/docs/walkthrough/screenshots
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-starttls.key \
            -out /tmp/nexora-starttls.crt \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE"
          cat /etc/ssl/certs/ca-certificates.crt /tmp/nexora-starttls.crt > /tmp/nexora-ca-bundle.pem
          export SSL_CERT_FILE=/tmp/nexora-ca-bundle.pem
          rm -f /tmp/nexora-mailbox.jsonl
          mkdir -p "$NEXORA_SCREENSHOTS"
          nohup uv run --python 3.12 python tests/e2e/smtp_sink.py \
            --cert /tmp/nexora-starttls.crt \
            --key /tmp/nexora-starttls.key \
            --outbox "$NEXORA_MAILBOX" \
            > /tmp/nexora-smtp.log 2>&1 &
          nohup uv run --python 3.12 uvicorn backend.main:app \
            --host 127.0.0.1 --port 8000 \
            > /tmp/nexora-api.log 2>&1 &
          cd "$GITHUB_WORKSPACE"
          nohup npm run preview -- --host 127.0.0.1 --port 4173 \
            > /tmp/nexora-frontend.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health >/tmp/nexora-health.json 2>/dev/null \
              && curl -fsS http://127.0.0.1:4173/welcome >/dev/null 2>&1 \
              && (echo > /dev/tcp/127.0.0.1/2525) >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/nexora-api.log /tmp/nexora-smtp.log /tmp/nexora-frontend.log
            exit 1
          fi
          cat /tmp/nexora-health.json
          curl -fsS http://127.0.0.1:4173/welcome >/dev/null
          cd "$GITHUB_WORKSPACE/Nexora-backend"
          SSL_CERT_FILE=/tmp/nexora-ca-bundle.pem uv run --python 3.12 python tests/e2e/run_browser_journey.py

      - name: Upload walkthrough screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-walkthrough-${{ github.run_number }}
          path: |
            docs/walkthrough/screenshots
            Nexora-backend/docs/testing
            /tmp/nexora-api.log
            /tmp/nexora-smtp.log
            /tmp/nexora-frontend.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish successful screenshots to main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots match the committed walkthrough."
            exit 0
          fi
          git commit -m "Refresh Nexora walkthrough screenshots"
          git push origin HEAD:main
