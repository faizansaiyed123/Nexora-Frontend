name: Nexora Full-Stack Walkthrough

on:
  push:
    branches: [main, "feat/**", "audit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: nexora-ci-only-secret-value-with-more-than-32-characters
      ENVIRONMENT: development
      DEBUG: "false"
      EMAIL_VERIFICATION_BYPASS: "false"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: nexora-ci-only
      SMTP_FROM_EMAIL: noreply@nexora.example.com
      SMTP_FROM_NAME: Nexora
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      ALLOWED_HOSTS: 127.0.0.1,localhost
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      GEMINI_DISCOVERY_ENABLED: "false"
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      SSL_CERT_FILE: /tmp/nexora-test-ca.pem
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          path: frontend
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.0 aiosmtpd
          uv sync --frozen --python 3.12
          uv run --python 3.12 python -m playwright install --with-deps chromium
      - name: Apply migrations and run backend suite
        working-directory: backend
        run: |
          uv run --python 3.12 alembic upgrade head
          uv run --python 3.12 pytest -q
      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
        run: |
          npm ci
          npm run test:security
          npm run build
      - name: Start isolated STARTTLS inbox
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout /tmp/nexora-smtp.key -out /tmp/nexora-smtp.crt \
            -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          cat /etc/ssl/certs/ca-certificates.crt /tmp/nexora-smtp.crt > /tmp/nexora-test-ca.pem
          python frontend/tests/e2e/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-smtp.crt --key /tmp/nexora-smtp.key \
            --outbox /tmp/nexora-mailbox.jsonl > /tmp/nexora-smtp.log 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2525) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log
          exit 1
      - name: Start backend API
        working-directory: backend
        run: |
          nohup uv run --python 3.12 uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/nexora-backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then cat /tmp/nexora-health.json; exit 0; fi
            sleep 2
          done
          cat /tmp/nexora-backend.log
          exit 1
      - name: Start frontend preview
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 > /tmp/nexora-frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/welcome >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-frontend.log
          exit 1
      - name: Run real browser-to-API-to-PostgreSQL journey
        run: |
          cd backend
          uv run --python 3.12 python ../frontend/tests/e2e/test_walkthrough.py
      - name: Publish walkthrough screenshots
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VISUAL-WALKTHROUGH.md docs/walkthrough/manifest.json docs/walkthrough/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged."; exit 0; fi
          git commit -m "docs: publish Nexora walkthrough screenshots [skip ci]"
          git push origin HEAD:main
      - name: Upload browser screenshots and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-full-stack-walkthrough
          path: |
            frontend/docs/walkthrough/screenshots/
            frontend/docs/walkthrough/manifest.json
            /tmp/nexora-backend.log
            /tmp/nexora-frontend.log
            /tmp/nexora-smtp.log
            /tmp/nexora-mailbox.jsonl
          if-no-files-found: warn
          retention-days: 21
