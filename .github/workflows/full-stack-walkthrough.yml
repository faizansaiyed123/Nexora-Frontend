name: Nexora Full-Stack Browser Walkthrough

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-walkthrough:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexora
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: nexora-isolated-ci-secret-32-characters-minimum
      ENVIRONMENT: development
      RATE_LIMIT_ENABLED: "false"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: nexora-ci-only
      SMTP_FROM_EMAIL: no-reply@nexora.test
      SMTP_FROM_NAME: Nexora CI
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      ALLOWED_HOSTS: "*"
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_BACKEND_ROOT: ${{ github.workspace }}/nexora-backend
      NEXORA_SCREENSHOTS: ${{ github.workspace }}/docs/walkthrough/screenshots
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          path: nexora-backend
          ref: main
      - name: Install frontend dependencies and run security checks
        run: |
          npm ci
          npm run test:security
          VITE_API_URL=http://127.0.0.1:8000 VITE_API_BUILD_MODE=development npm run build
      - name: Install backend and Chromium
        working-directory: nexora-backend
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --python 3.12
          uv run --python 3.12 playwright install --with-deps chromium
      - name: Apply PostgreSQL schema
        working-directory: nexora-backend
        run: uv run --python 3.12 alembic upgrade head
      - name: Run backend API and PostgreSQL integration coverage
        working-directory: nexora-backend
        env:
          EMAIL_VERIFICATION_BYPASS: "true"
        run: uv run --python 3.12 pytest -q
      - name: Create and trust isolated SMTP certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/nexora-smtp.key -out /tmp/nexora-smtp.crt \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo cp /tmp/nexora-smtp.crt /usr/local/share/ca-certificates/nexora-smtp-ci.crt
          sudo update-ca-certificates
      - name: Start isolated STARTTLS email inbox
        working-directory: nexora-backend
        run: |
          uv run --python 3.12 --with aiosmtpd==1.4.6 python "$GITHUB_WORKSPACE/scripts/test_smtp_sink.py" \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-smtp.crt --outbox /tmp/nexora-mailbox.jsonl \
            > /tmp/nexora-smtp.log 2>&1 &
          echo $! > /tmp/nexora-smtp.pid
          for i in $(seq 1 30); do
            if grep -q "listening" /tmp/nexora-smtp.log; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log
          exit 1
      - name: Start API and frontend preview
        run: |
          cd nexora-backend
          EMAIL_VERIFICATION_BYPASS=false uv run --python 3.12 uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/nexora-api.log 2>&1 &
          echo $! > /tmp/nexora-api.pid
          cd "$GITHUB_WORKSPACE"
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/nexora-frontend.log 2>&1 &
          echo $! > /tmp/nexora-frontend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json && curl -fsS http://127.0.0.1:4173/welcome > /dev/null; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nexora-api.log
          cat /tmp/nexora-frontend.log
          exit 1
      - name: Run real UI-to-API-to-PostgreSQL walkthrough
        working-directory: nexora-backend
        run: uv run --python 3.12 python "$GITHUB_WORKSPACE/scripts/e2e_walkthrough.py"
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-browser-walkthrough-${{ github.run_number }}
          path: |
            docs/walkthrough/screenshots/
            docs/walkthrough/manifest.json
            docs/walkthrough/run-summary.json
            /tmp/nexora-api.log
            /tmp/nexora-frontend.log
            /tmp/nexora-smtp.log
          if-no-files-found: warn
          retention-days: 30
      - name: Publish walkthrough screenshots to main
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough
          if git diff --cached --quiet; then
            echo "Walkthrough assets are already current."
            exit 0
          fi
          git commit -m "Publish Nexora product walkthrough screenshots"
          git push origin HEAD:main
