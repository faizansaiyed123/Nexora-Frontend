name: Nexora Full-Stack Walkthrough

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-stack:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[walkthrough-assets]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JWT_SECRET_KEY: nexora-browser-ci-secret-key-rotate-before-production-2026
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexora
      REDIS_URL: redis://127.0.0.1:6379/0
      ENVIRONMENT: development
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: nexora-ci-test-only
      SMTP_FROM_EMAIL: noreply@nexora.test
      SMTP_FROM_NAME: Nexora Review Inbox
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      ALLOWED_HOSTS: "*"
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out the frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: Nexora-backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: Nexora-backend
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --frozen --python 3.12

      - name: Apply PostgreSQL migrations
        working-directory: Nexora-backend
        run: uv run --python 3.12 alembic upgrade head

      - name: Check backend API lifecycle and tenant boundaries
        working-directory: Nexora-backend
        env:
          EMAIL_VERIFICATION_BYPASS: "true"
        run: uv run --python 3.12 pytest -q

      - name: Build the real frontend
        run: |
          npm ci
          npm run test:security
          npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development

      - name: Install Chromium
        working-directory: Nexora-backend
        run: uv run --python 3.12 python -m playwright install --with-deps chromium

      - name: Prepare trusted STARTTLS inbox
        run: |
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/nexora-ci-smtp-key.pem \
            -out /tmp/nexora-ci-smtp-cert.pem \
            -days 2 -nodes -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -addext "basicConstraints=critical,CA:TRUE"
          cat /etc/ssl/certs/ca-certificates.crt /tmp/nexora-ci-smtp-cert.pem > /tmp/nexora-ci-trust.pem
          echo "SSL_CERT_FILE=/tmp/nexora-ci-trust.pem" >> "$GITHUB_ENV"
          nohup uv run --directory Nexora-backend python scripts/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-ci-smtp-cert.pem \
            --key /tmp/nexora-ci-smtp-key.pem \
            --outbox "$NEXORA_MAILBOX" >/tmp/nexora-smtp.log 2>&1 &
          for attempt in $(seq 1 40); do
            if (echo > /dev/tcp/127.0.0.1/2525) >/dev/null 2>&1; then break; fi
            sleep 0.25
          done

      - name: Start FastAPI and the built frontend
        run: |
          (cd Nexora-backend && nohup uv run --python 3.12 uvicorn backend.main:app --host 127.0.0.1 --port 8000 >/tmp/nexora-api.log 2>&1 &)
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/nexora-frontend.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8000/v1/health >/tmp/nexora-health.json 2>/dev/null; then break; fi
            sleep 0.5
          done
          cat /tmp/nexora-health.json
          curl -fsS http://127.0.0.1:4173/welcome >/dev/null
          echo "FastAPI and the built React frontend are responding."

      - name: Follow the browser journey
        env:
          PYTHONPATH: ${{ github.workspace }}/Nexora-backend/src
        run: python scripts/e2e_walkthrough.py

      - name: Publish the walkthrough screenshots
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/screenshots docs/walkthrough/README.md
          if git diff --cached --quiet; then
            echo "Walkthrough assets are already current."
          else
            git commit -m "Publish Nexora walkthrough screenshots [walkthrough-assets]"
            git push origin HEAD:main
          fi

      - name: Upload screenshots, database evidence and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-browser-journey-${{ github.run_number }}
          path: |
            docs/walkthrough/screenshots/
            artifacts/e2e/database-evidence.json
            /tmp/nexora-api.log
            /tmp/nexora-frontend.log
            /tmp/nexora-smtp.log
            /tmp/nexora-mailbox.jsonl
          if-no-files-found: warn
          retention-days: 21
