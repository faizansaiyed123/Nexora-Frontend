name: Nexora one-shot lockfile generation
on:
  push:
    branches:
      - remediation/nexora-zip-integration-20261003

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/generate-lockfile.yml
          git commit -m "build: add deterministic frontend lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}