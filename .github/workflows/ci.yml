name: Nexora Full-Stack Visual Journey (Role Permissions)

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
    paths-ignore:
      - "docs/testing/visuals/**"
      - "docs/testing/visual-manifest.json"
      - "docs/walkthrough/**"
      - "docs/PRODUCT-WALKTHROUGH.md"
      - "docs/VISUAL-WALKTHROUGH.md"
      - "README.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nexora-full-stack-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  browser-journey:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: nexora-ci-only-secret-for-disposable-database-2026
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout Nexora frontend
        uses: actions/checkout@v4

      - name: Checkout Nexora backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: Nexora-backend

      - name: Record paired backend revision
        working-directory: Nexora-backend
        run: git rev-parse HEAD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend security and session tests
        run: npm run test:security

      - name: Build frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
        run: npm run build

      - name: Install backend and browser dependencies
        working-directory: Nexora-backend
        run: |
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python aiosmtpd
          uv run --python 3.12 playwright install --with-deps chromium

      - name: Apply PostgreSQL migrations
        working-directory: Nexora-backend
        run: uv run --python 3.12 alembic upgrade head

      - name: Run backend API integration suite
        working-directory: Nexora-backend
        run: uv run --python 3.12 pytest -q

      - name: Prepare an isolated STARTTLS email inbox
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-test-key.pem \
            -out /tmp/nexora-test-cert.pem \
            -days 1 -subj "/CN=localhost" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          cat /etc/ssl/certs/ca-certificates.crt /tmp/nexora-test-cert.pem > /tmp/nexora-ca-bundle.pem
          cd Nexora-backend
          .venv/bin/python tests/e2e/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-test-cert.pem \
            --key /tmp/nexora-test-key.pem \
            --outbox /tmp/nexora-mailbox.jsonl \
            > /tmp/nexora-smtp.log 2>&1 &
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 2525; then
              echo "STARTTLS inbox ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log
          exit 1

      - name: Start isolated Northstar product fixtures
        working-directory: Nexora-backend
        run: |
          echo "127.0.0.1 retail.northstar.example" | sudo tee -a /etc/hosts > /dev/null
          .venv/bin/python tests/fixture_server.py --host 127.0.0.1 --port 8877 > /tmp/nexora-fixtures.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --noproxy '*' -fsS http://retail.northstar.example:8877/fixtures/retail-price-js.html > /tmp/nexora-render-fixture.html; then
              grep -q 'id="product-jsonld"' /tmp/nexora-render-fixture.html
              echo "Isolated Northstar product fixtures ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-fixtures.log
          exit 1

      - name: Start the live FastAPI service
        working-directory: Nexora-backend
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          ALLOW_LOCAL_TEST_FIXTURES: "true"
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "2525"
          SMTP_USERNAME: nexora-ci
          SMTP_PASSWORD: nexora-ci-only
          SMTP_FROM_EMAIL: noreply@northstar.example.com
          SMTP_FROM_NAME: Nexora CI
          FRONTEND_URL: http://127.0.0.1:4173
          CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:5173
          SSL_CERT_FILE: /tmp/nexora-ca-bundle.pem
          GEMINI_DISCOVERY_ENABLED: "false"
        run: |
          uv run --python 3.12 uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/nexora-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nexora-api.log
          exit 1

      - name: Start the real Celery worker for scheduled collections
        working-directory: Nexora-backend
        env:
          ALLOW_LOCAL_TEST_FIXTURES: "true"
          SSL_CERT_FILE: /tmp/nexora-ca-bundle.pem
          GEMINI_DISCOVERY_ENABLED: "false"
        run: |
          uv run --python 3.12 celery -A backend.workers.celery_app:celery_app worker --loglevel=INFO --pool=solo --concurrency=1 > /tmp/nexora-celery.log 2>&1 &
          for i in $(seq 1 45); do
            if grep -qE "ready\\." /tmp/nexora-celery.log; then
              tail -n 30 /tmp/nexora-celery.log
              echo "Celery worker ready to accept Redis tasks"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-celery.log
          exit 1

      - name: Start the built frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nexora-frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/welcome > /dev/null; then
              echo "Frontend preview ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-frontend.log
          exit 1

      - name: Clear previous walkthrough captures
        run: |
          mkdir -p docs/testing/visuals
          rm -f docs/testing/visuals/*.png docs/testing/visuals/postgres-evidence.json

      - name: Run real browser-to-API-to-PostgreSQL journey
        working-directory: Nexora-backend
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          ALLOW_LOCAL_TEST_FIXTURES: "true"
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "2525"
          SMTP_USERNAME: nexora-ci
          SMTP_PASSWORD: nexora-ci-only
          SMTP_FROM_EMAIL: noreply@northstar.example.com
          SMTP_FROM_NAME: Nexora CI
          FRONTEND_URL: http://127.0.0.1:4173
          CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:5173
          SSL_CERT_FILE: /tmp/nexora-ca-bundle.pem
          GEMINI_DISCOVERY_ENABLED: "false"
          NEXORA_SCREENSHOT_DIR: ../docs/testing/visuals
        run: uv run --python 3.12 python tests/browser_walkthrough.py

      - name: Build screenshot manifest
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("docs/testing/visuals")
          screenshots = sorted(folder.glob("*.png"))
          if len(screenshots) != 68:
              raise SystemExit(f"Expected 68 walkthrough screenshots; found {len(screenshots)}")

          walkthrough = Path("docs/testing/VISUAL-TEST-WALKTHROUGH.md").read_text(encoding="utf-8")
          referenced = {
              line.split("visuals/", 1)[1].split(")", 1)[0]
              for line in walkthrough.splitlines()
              if "visuals/" in line and ".png)" in line
          }
          available = {item.name for item in screenshots}
          if referenced != available:
              raise SystemExit(
                  f"Walkthrough image mismatch. Missing: {sorted(referenced-available)}; "
                  f"unreferenced: {sorted(available-referenced)}"
              )

          evidence_file = folder / "postgres-evidence.json"
          if not evidence_file.is_file():
              raise SystemExit("PostgreSQL read-back evidence was not written by the browser journey")
          evidence = json.loads(evidence_file.read_text(encoding="utf-8"))
          if int(evidence.get("scheduled_collection_jobs_completed", 0)) < 1:
              raise SystemExit("A completed scheduled Celery collection is missing from PostgreSQL evidence.")

          manifest = {
              "product": "Nexora",
              "screenshot_count": len(screenshots),
              "screenshots": [
                  {"filename": item.name, "bytes": item.stat().st_size}
                  for item in screenshots
              ],
              "database_evidence": {
                  "file": "visuals/postgres-evidence.json",
                  "verified_observations": evidence.get("observations", 0),
                  "verified_collection_jobs": evidence.get("jobs", 0),
                  "verified_scheduled_collection_jobs": evidence.get("scheduled_collection_jobs_completed", 0),
                  "latest_snapshot_price": evidence.get("snapshot_price"),
                  "notification_statuses": evidence.get("notification_statuses", []),
              },
          }
          Path("docs/testing/visual-manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          print(f"Manifest created for {len(screenshots)} walkthrough screenshots.")
          PY

      - name: Sync visitor-facing screenshot gallery
        if: success()
        run: |
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          source = Path("docs/testing/visuals")
          destination = Path("docs/walkthrough/screenshots")
          destination.mkdir(parents=True, exist_ok=True)

          # Replace stale public screenshots with the ones captured in this run.
          for old_image in destination.glob("*.png"):
              old_image.unlink()

          images = sorted(source.glob("*.png"))
          if len(images) != 68:
              raise SystemExit(f"Expected 68 fresh screenshots; found {len(images)}")

          for image in images:
              shutil.copy2(image, destination / image.name)

          readme = Path("docs/walkthrough/README.md").read_text(encoding="utf-8")
          referenced = set(re.findall(r"!\[[^\]]*\]\(screenshots/([^)]+\.png)\)", readme))
          available = {image.name for image in images}
          if referenced != available:
              raise SystemExit(
                  f"Visitor gallery mismatch. Missing: {sorted(referenced-available)}; "
                  f"unreferenced: {sorted(available-referenced)}"
              )

          manifest = {
              "count": len(images),
              "screenshots": [
                  {"filename": image.name, "bytes": image.stat().st_size}
                  for image in sorted(destination.glob("*.png"))
              ],
          }
          Path("docs/walkthrough/manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          print(f"Published {len(images)} visitor walkthrough screenshots.")
          PY

      - name: Upload screenshots and PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-visual-walkthrough
          path: |
            docs/testing/visuals/
            docs/testing/visual-manifest.json
            /tmp/nexora-health.json
            /tmp/nexora-api.log
            /tmp/nexora-frontend.log
            /tmp/nexora-smtp.log
            /tmp/nexora-fixtures.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish walkthrough screenshots on main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep this run's binary screenshots outside the checkout while rebasing
          # onto the latest main. Replaying a binary screenshot diff over another
          # run's screenshot commit causes conflicts, even when runs are serialized.
          publish_dir="$(mktemp -d)"
          mkdir -p "$publish_dir/testing/visuals" "$publish_dir/walkthrough/screenshots"
          cp docs/testing/visual-manifest.json "$publish_dir/testing/"
          cp docs/testing/visuals/*.png docs/testing/visuals/postgres-evidence.json "$publish_dir/testing/visuals/"
          cp docs/walkthrough/manifest.json "$publish_dir/walkthrough/"
          cp docs/walkthrough/screenshots/*.png "$publish_dir/walkthrough/screenshots/"

          # The complete journey and manifest validation run before this step.
          test "$(find "$publish_dir/testing/visuals" -maxdepth 1 -name '*.png' | wc -l)" -eq 68
          test "$(find "$publish_dir/walkthrough/screenshots" -maxdepth 1 -name '*.png' | wc -l)" -eq 68

          # Apply these captures as a fresh snapshot on top of current main rather
          # than rebasing a commit containing binary PNG diffs from an older base.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach --force origin/main
            mkdir -p docs/testing/visuals docs/walkthrough/screenshots
            cp "$publish_dir/testing/visual-manifest.json" docs/testing/visual-manifest.json
            rm -f docs/testing/visuals/*.png docs/testing/visuals/postgres-evidence.json
            cp "$publish_dir/testing/visuals/"* docs/testing/visuals/
            cp "$publish_dir/walkthrough/manifest.json" docs/walkthrough/manifest.json
            rm -f docs/walkthrough/screenshots/*.png
            cp "$publish_dir/walkthrough/screenshots/"*.png docs/walkthrough/screenshots/
            git add docs/testing/visual-manifest.json docs/testing/visuals/ docs/walkthrough/manifest.json docs/walkthrough/screenshots/

            if git diff --cached --quiet; then
              echo "Walkthrough screenshots have not changed."
              exit 0
            fi

            git commit -m "Publish Nexora visual walkthrough evidence [skip ci]"
            if git push origin HEAD:main; then
              echo "Published the validated walkthrough snapshot."
              exit 0
            fi
            echo "Publish raced with another main update (attempt $attempt); refreshing main and retrying." >&2
          done
          echo "Unable to publish walkthrough captures after three attempts." >&2
          exit 1

      - name: Show service logs after a failure
        if: failure()
        run: |
          echo "===== backend API ====="
          cat /tmp/nexora-api.log 2>/dev/null || true
          echo "===== frontend preview ====="
          cat /tmp/nexora-frontend.log 2>/dev/null || true
          echo "===== SMTP inbox ====="
          cat /tmp/nexora-smtp.log 2>/dev/null || true
          echo "===== local product fixtures ====="
          cat /tmp/nexora-fixtures.log 2>/dev/null || true
          echo "===== Celery worker ====="
          cat /tmp/nexora-celery.log 2>/dev/null || true
