name: Nexora Frontend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Validate production Compose
        env:
          VITE_API_URL: https://api.example.test
        run: docker compose -f docker-compose.prod.yml config

      - name: Build frontend production image
        env:
          VITE_API_URL: https://api.example.test
        run: docker build --pull --build-arg VITE_API_URL=$VITE_API_URL -t nexora-frontend:ci .
