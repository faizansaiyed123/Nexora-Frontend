name: Nexora Frontend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: nexora-frontend-lockfile
          path: package-lock.json
      - run: npm run build
