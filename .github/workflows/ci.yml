name: Nexora Frontend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_API_BUILD_MODE: production
