name: Nexora Connected Product Walkthrough

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-connected-walkthrough-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connected-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: nexora-isolated-ci-signing-key-41-characters-long
      ENVIRONMENT: development
      RATE_LIMIT_ENABLED: "false"
      EMAIL_VERIFICATION_BYPASS: "false"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: isolated-ci-mailbox-password
      SMTP_FROM_EMAIL: no-reply@nexora-ci.example
      SMTP_FROM_NAME: Nexora
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173
      ALLOWED_HOSTS: 127.0.0.1,localhost
      GEMINI_DISCOVERY_ENABLED: "false"
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOTS: docs/walkthrough/screenshots
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out the frontend
        uses: actions/checkout@v4

      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.10.0"

      - name: Install backend and isolated SMTP receiver
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python "aiosmtpd>=1.4.6,<2"
          uv run --python 3.12 playwright install --with-deps chromium

      - name: Prepare a local STARTTLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-smtp.key \
            -out /tmp/nexora-smtp.crt \
            -days 1 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE"
          cat /etc/ssl/certs/ca-certificates.crt /tmp/nexora-smtp.crt > /tmp/nexora-ca-bundle.pem
          echo "SSL_CERT_FILE=/tmp/nexora-ca-bundle.pem" >> "$GITHUB_ENV"

      - name: Apply database migrations
        working-directory: backend
        run: uv run --python 3.12 alembic upgrade head

      - name: Verify backend integration suite
        working-directory: backend
        env:
          EMAIL_VERIFICATION_BYPASS: "true"
          CORS_ORIGINS: http://localhost:5173
        run: uv run --python 3.12 pytest -q

      - name: Start isolated STARTTLS inbox
        run: |
          nohup uv run --project backend --python 3.12 python tests/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-smtp.crt \
            --key /tmp/nexora-smtp.key \
            --outbox /tmp/nexora-mailbox.jsonl \
            > /tmp/nexora-smtp.log 2>&1 &
          for attempt in $(seq 1 40); do
            if nc -z 127.0.0.1 2525; then
              echo "Isolated SMTP listener is ready."
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/nexora-smtp.log
          exit 1

      - name: Start FastAPI connected to PostgreSQL and Redis
        working-directory: backend
        run: |
          nohup uv run --python 3.12 uvicorn backend.main:app \
            --host 127.0.0.1 --port 8000 \
            > /tmp/nexora-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-api.log
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend security checks
        run: npm run test:security

      - name: Build frontend with the connected API URL
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development

      - name: Start frontend preview
        run: |
          rm -rf docs/walkthrough/screenshots
          mkdir -p docs/walkthrough/screenshots
          nohup npm run preview -- --host 127.0.0.1 --port 4173 \
            > /tmp/nexora-frontend.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/welcome >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/nexora-frontend.log
          exit 1

      - name: Run real browser-to-API-to-database journey
        run: uv run --project backend --python 3.12 python tests/e2e_browser.py

      - name: Build screenshot index
        if: success()
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("docs/walkthrough/screenshots")
          images = [
              {"filename": path.name, "bytes": path.stat().st_size}
              for path in sorted(root.glob("*.png"))
          ]
          if len(images) < 30 or any(item["bytes"] < 1000 for item in images):
              raise SystemExit(f"Incomplete walkthrough screenshot set: {len(images)} images")
          filenames = {item["filename"] for item in images}
          for doc in (
              Path("docs/walkthrough/README.md"),
              Path("docs/walkthrough/NEXORA-PRODUCT-WALKTHROUGH.md"),
          ):
              text = doc.read_text(encoding="utf-8")
              referenced = set(re.findall(r"screenshots/([A-Za-z0-9.-]+)", text))
              missing = sorted(referenced - filenames)
              unlinked = sorted(filenames - referenced)
              if missing or unlinked:
                  raise SystemExit(
                      f"{doc}: missing screenshot files={missing}; unlinked screenshots={unlinked}"
                  )
              print(f"{doc}: {len(referenced)} screenshot links match the captured assets.")
          Path("docs/walkthrough/manifest.json").write_text(
              json.dumps({"count": len(images), "screenshots": images}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Indexed {len(images)} screenshots.")
          PY

      - name: Upload screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-connected-walkthrough-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            docs/walkthrough/screenshots/
            /tmp/nexora-api.log
            /tmp/nexora-smtp.log
            /tmp/nexora-frontend.log
            /tmp/nexora-worker.log
            /tmp/nexora-health.json
            /tmp/nexora-scheduled-job-db-evidence.json
            /tmp/nexora-db-evidence.json
          retention-days: 21

      - name: Publish successful screenshots to the walkthrough
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/README.md docs/walkthrough/NEXORA-PRODUCT-WALKTHROUGH.md docs/walkthrough/screenshots docs/walkthrough/manifest.json
          if git diff --cached --quiet; then
            echo "Walkthrough screenshots are already current."
            exit 0
          fi
          git commit -m "Refresh Nexora walkthrough screenshots [skip ci]"

          # main can move while a browser run is capturing images. Rebase only
          # the documentation/artifact commit onto the latest main and retry.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Screenshot publish raced with another main update (attempt $attempt)."
            sleep 2
          done
          echo "Could not publish screenshots after three retries."
          exit 1

      - name: Show service logs after a failure
        if: failure()
        run: |
          echo "===== API ====="
          cat /tmp/nexora-api.log 2>/dev/null || true
          echo "===== SMTP ====="
          cat /tmp/nexora-smtp.log 2>/dev/null || true
          echo "===== Frontend ====="
          cat /tmp/nexora-frontend.log 2>/dev/null || true
          echo "===== Celery worker ====="
          cat /tmp/nexora-worker.log 2>/dev/null || true
