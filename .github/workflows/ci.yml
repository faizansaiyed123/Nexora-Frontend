name: Nexora Frontend CI

on:
  push:
    branches: [main, "feat/**", "audit/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_API_BUILD_MODE: production

  full-stack:
    name: Browser → API → PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: nexora-ci-only-signing-key-2026-keep-production-separate
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      ALLOWED_HOSTS: "*"
      CORS_ORIGINS: http://127.0.0.1:4173
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-e2e
      SMTP_PASSWORD: nexora-e2e-only
      SMTP_FROM_EMAIL: no-reply@nexora.test
      SMTP_FROM_NAME: Nexora Review
      FRONTEND_URL: http://127.0.0.1:4173
      GEMINI_DISCOVERY_ENABLED: "false"
      AUTO_RENDER_ENABLED: "false"
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip aiosmtpd
      - run: pip install "uv==0.10.0"

      - name: Prepare isolated STARTTLS inbox
        run: |
          mkdir -p /tmp/nexora-smtp
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/nexora-smtp/key.pem \
            -out /tmp/nexora-smtp/cert.pem \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign,keyEncipherment"
          cat /etc/ssl/certs/ca-certificates.crt /tmp/nexora-smtp/cert.pem > /tmp/nexora-smtp/ca-bundle.pem
          echo "SSL_CERT_FILE=/tmp/nexora-smtp/ca-bundle.pem" >> "$GITHUB_ENV"
          nohup python tests/smtp_sink.py --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-smtp/cert.pem --key /tmp/nexora-smtp/key.pem \
            --outbox /tmp/nexora-mailbox.jsonl > /tmp/nexora-smtp/sink.log 2>&1 &
          for attempt in $(seq 1 40); do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1',2525),timeout=1); s.close()" 2>/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/nexora-smtp/sink.log
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.12
      - name: Migrate disposable PostgreSQL
        working-directory: backend
        run: uv run --python 3.12 alembic upgrade head
      - name: Start FastAPI
        run: |
          nohup uv run --project backend --python 3.12 uvicorn backend.main:app --host 0.0.0.0 --port 8000 > /tmp/nexora-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-api.log
          exit 1

      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend security checks
        run: npm run test:security
      - name: Build frontend for isolated API
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
      - name: Install Chromium
        run: uv run --project backend --python 3.12 playwright install --with-deps chromium
      - name: Start frontend preview
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/nexora-frontend.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/welcome > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-frontend.log
          exit 1

      - name: Exercise actual UI and persisted domain workflows
        env:
          NEXORA_SCREENSHOTS: ${{ github.workspace }}/docs/testing/screenshots
        run: uv run --project backend --python 3.12 python tests/e2e_browser.py

      - name: Copy service logs
        if: always()
        run: |
          mkdir -p test-results
          cp /tmp/nexora-api.log test-results/api.log 2>/dev/null || true
          cp /tmp/nexora-frontend.log test-results/frontend.log 2>/dev/null || true
          cp /tmp/nexora-smtp/sink.log test-results/smtp.log 2>/dev/null || true
          cp /tmp/nexora-health.json test-results/health.json 2>/dev/null || true
          cp /tmp/nexora-mailbox.jsonl test-results/mailbox.jsonl 2>/dev/null || true

      - name: Upload browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-full-stack-evidence
          if-no-files-found: warn
          path: |
            docs/testing/screenshots/*.png
            test-results/*

      - name: Publish walkthrough from a passing main run
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXORA_TESTED_SHA: ${{ github.sha }}
          NEXORA_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; evidence remains in the workflow artifact."
            exit 0
          fi
          NEXORA_BACKEND_SHA="$(git -C backend rev-parse HEAD)" node scripts/publish-visual-walkthrough.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/VISUAL-TEST-WALKTHROUGH.md docs/testing/visuals/manifest.json docs/testing/screenshots
          if git diff --cached --quiet; then echo "Walkthrough evidence is unchanged."; exit 0; fi
          git commit -m "Publish verified Nexora walkthrough evidence [skip ci]"
          git push origin HEAD:main
