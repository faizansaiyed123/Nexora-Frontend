name: Nexora Frontend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_API_BUILD_MODE: production

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: nexora-browser-ci-only-secret-key-minimum-32-characters
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      SMTP_HOST: localhost
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: nexora-ci-only-password
      SMTP_FROM_EMAIL: no-reply@nexora.test
      SMTP_FROM_NAME: Nexora CI
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:5173
      ALLOWED_HOSTS: 127.0.0.1,localhost
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
      - run: pip install "uv==0.10.0"
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: uv pip install --python .venv/bin/python "aiosmtpd>=1.4,<2"
        working-directory: backend
      - run: uv run --python 3.12 playwright install --with-deps chromium
        working-directory: backend
      - name: Apply disposable database migrations
        run: uv run --python 3.12 alembic upgrade head
        working-directory: backend

      - name: Start isolated STARTTLS mailbox, API and frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexora-tls
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-tls/key.pem \
            -out /tmp/nexora-tls/cert.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE" >/dev/null 2>&1

          backend/.venv/bin/python tests/e2e/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-tls/cert.pem \
            --key /tmp/nexora-tls/key.pem \
            --outbox "$NEXORA_MAILBOX" >/tmp/nexora-smtp.log 2>&1 &
          echo $! >/tmp/nexora-smtp.pid

          cd backend
          PYTHONPATH="$GITHUB_WORKSPACE/backend/src" \
          SSL_CERT_FILE=/tmp/nexora-tls/cert.pem \
          uv run --python 3.12 uvicorn backend.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/nexora-api.log 2>&1 &
          echo $! >/tmp/nexora-api.pid
          cd "$GITHUB_WORKSPACE"

          npm run preview -- --host 127.0.0.1 --port 4173 \
            >/tmp/nexora-web.log 2>&1 &
          echo $! >/tmp/nexora-web.pid

          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/v1/health >/tmp/nexora-health.json \
              && curl --silent --fail http://127.0.0.1:4173/welcome >/dev/null \
              && grep -q "STARTTLS inbox ready" /tmp/nexora-smtp.log; then
              cat /tmp/nexora-health.json
              echo "Nexora API, database, Redis, frontend and inbox are ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nexora-smtp.log || true
          cat /tmp/nexora-api.log || true
          cat /tmp/nexora-web.log || true
          exit 1

      - name: Exercise browser-to-API-to-PostgreSQL domain flows
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/src
          SSL_CERT_FILE: /tmp/nexora-tls/cert.pem
        run: backend/.venv/bin/python tests/e2e/nexora_journey.py

      - name: Upload browser screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-walkthrough-${{ github.run_number }}
          path: |
            docs/walkthrough/screenshots/
            /tmp/nexora-smtp.log
            /tmp/nexora-api.log
            /tmp/nexora-web.log
            /tmp/nexora-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish successful screenshots to main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/screenshots/*.png docs/walkthrough/screenshots/manifest.json
          if git diff --cached --quiet; then
            echo "Walkthrough screenshots are already current."
          else
            git commit -m "docs: refresh Nexora walkthrough screenshots [skip ci]"
            git push origin HEAD:main
          fi
