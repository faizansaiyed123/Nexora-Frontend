name: Nexora Full-Stack Walkthrough

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  full-stack:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: nexora-ci-only-signing-secret-32-characters-minimum
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      ALLOWED_HOSTS: "*"
      CORS_ORIGINS: http://127.0.0.1:4173
      RATE_LIMIT_LOGIN_PER_MINUTE: "150"
      RATE_LIMIT_REGISTER_PER_HOUR: "150"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "150"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "150"
      RATE_LIMIT_ENABLED: "true"
      EMAIL_VERIFICATION_BYPASS: "true"
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOT_DIR: ${{ github.workspace }}/docs/walkthrough/screenshots
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          path: Nexora-backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend security and session tests
        run: npm run test:security
      - name: Build production-configured frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_API_BUILD_MODE: production
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and backend dependencies
        working-directory: Nexora-backend
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --frozen --python 3.12
      - name: Install Chromium and operating-system libraries
        working-directory: Nexora-backend
        run: uv run --python 3.12 playwright install --with-deps chromium
      - name: Apply PostgreSQL migrations
        working-directory: Nexora-backend
        run: uv run --python 3.12 alembic upgrade head
      - name: Run backend API and database integration suite
        working-directory: Nexora-backend
        run: uv run --python 3.12 pytest -q
      - name: Build isolated STARTTLS certificate
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 2 \
            -keyout /tmp/nexora-test-ca.key -out /tmp/nexora-test-ca.crt \
            -subj "/CN=Nexora Browser Test CA" \
            -addext "basicConstraints=critical,CA:TRUE"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout /tmp/nexora-smtp.key -out /tmp/nexora-smtp.csr \
            -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n" > /tmp/nexora-smtp.ext
          openssl x509 -req -in /tmp/nexora-smtp.csr \
            -CA /tmp/nexora-test-ca.crt -CAkey /tmp/nexora-test-ca.key \
            -CAcreateserial -out /tmp/nexora-smtp.crt -days 2 \
            -extfile /tmp/nexora-smtp.ext
          sudo cp /tmp/nexora-test-ca.crt /usr/local/share/ca-certificates/nexora-browser-test-ca.crt
          sudo update-ca-certificates
      - name: Start isolated SMTP inbox
        working-directory: Nexora-backend
        run: |
          nohup uv run --python 3.12 python tests/run_smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-smtp.crt --key /tmp/nexora-smtp.key \
            --outbox /tmp/nexora-mailbox.jsonl > /tmp/nexora-smtp.log 2>&1 &
          for i in $(seq 1 40); do
            if nc -z 127.0.0.1 2525; then break; fi
            sleep 0.25
          done
          nc -z 127.0.0.1 2525
      - name: Start API with verification email enabled
        working-directory: Nexora-backend
        run: |
          nohup env \
            EMAIL_VERIFICATION_BYPASS=false \
            SMTP_HOST=localhost SMTP_PORT=2525 \
            SMTP_USERNAME=ci-user SMTP_PASSWORD=ci-pass \
            SMTP_FROM_EMAIL=noreply@nexora.test SMTP_FROM_NAME=Nexora \
            FRONTEND_URL=http://127.0.0.1:4173 \
            CORS_ORIGINS=http://127.0.0.1:4173 \
            uv run --python 3.12 uvicorn backend.main:app \
              --host 127.0.0.1 --port 8000 > /tmp/nexora-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then break; fi
            sleep 1
          done
          cat /tmp/nexora-health.json
          curl --silent --fail http://127.0.0.1:8000/v1/health
      - name: Build local-API frontend bundle
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
      - name: Start frontend preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nexora-frontend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/welcome > /dev/null; then break; fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:4173/welcome > /dev/null
      - name: Exercise real UI, API, PostgreSQL and email workflows
        working-directory: Nexora-backend
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          SMTP_HOST: localhost
          SMTP_PORT: "2525"
          SMTP_USERNAME: ci-user
          SMTP_PASSWORD: ci-pass
          SMTP_FROM_EMAIL: noreply@nexora.test
          SMTP_FROM_NAME: Nexora
          FRONTEND_URL: http://127.0.0.1:4173
          CORS_ORIGINS: http://127.0.0.1:4173
        run: uv run --python 3.12 python tests/run_browser_walkthrough.py
      - name: Create screenshot manifest
        if: success()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("docs/walkthrough/screenshots")
          files = sorted(p for p in root.glob("*.png") if p.is_file())
          manifest = {
              "project": "Nexora",
              "screenshots": [
                  {"file": p.name, "bytes": p.stat().st_size,
                   "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in files
              ],
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Manifest includes {len(files)} browser screenshots.")
          PY
      - name: Publish successful walkthrough screenshots to main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/VISUAL-PRODUCT-WALKTHROUGH.md docs/walkthrough/screenshots
          if git diff --cached --quiet; then
            echo "Walkthrough images are already up to date."
          else
            git commit -m "Refresh Nexora visual product walkthrough"
            git push origin HEAD:main
          fi
      - name: Upload browser and service evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-e2e-diagnostics
          if-no-files-found: warn
          path: |
            docs/walkthrough/screenshots
            /tmp/nexora-api.log
            /tmp/nexora-frontend.log
            /tmp/nexora-smtp.log
            /tmp/nexora-mailbox.jsonl
