name: Nexora Demo CI

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_URL: "https://demo.nexora.invalid"
      - run: npm run test:security
