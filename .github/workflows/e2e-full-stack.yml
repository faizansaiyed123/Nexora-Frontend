name: Nexora Full-Stack Walkthrough

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/e2e_browser.py"
      - "tests/smtp_sink.py"
      - "package.json"
      - "package-lock.json"
      - "docs/walkthrough/**"
      - ".github/workflows/e2e-full-stack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-full-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexora
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: nexora-e2e-jwt-signing-key-only-for-disposable-ci-2026
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "false"
      ALLOW_PRODUCTION_EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
      RATE_LIMIT_REGISTER_PER_HOUR: "1000"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173
      ALLOWED_HOSTS: 127.0.0.1,localhost
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: nexora-ci
      SMTP_FROM_EMAIL: notifications@nexora.test
      SMTP_FROM_NAME: Nexora CI
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOTS: ${{ github.workspace }}/docs/walkthrough/screenshots
      SSL_CERT_FILE: /tmp/nexora-smtp.crt
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out backend repository
        run: git clone --depth 1 https://github.com/faizansaiyed123/Nexora-backend.git backend
      - name: Install backend, browser and mail-sink dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python "aiosmtpd==1.4.6"
          uv run --python 3.12 python -m playwright install --with-deps chromium
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: uv run --python 3.12 alembic upgrade head
      - name: Start isolated STARTTLS inbox
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-smtp.key \
            -out /tmp/nexora-smtp.crt \
            -subj "/CN=127.0.0.1" -days 1 \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign"
          rm -f "$NEXORA_MAILBOX"
          nohup backend/.venv/bin/python tests/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-smtp.crt \
            --key /tmp/nexora-smtp.key \
            --outbox "$NEXORA_MAILBOX" \
            >/tmp/nexora-smtp.log 2>&1 &
          for n in $(seq 1 30); do
            if nc -z 127.0.0.1 2525; then
              echo "STARTTLS inbox is listening."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log
          exit 1
      - name: Start FastAPI against PostgreSQL and Redis
        working-directory: backend
        run: |
          nohup uv run --python 3.12 uvicorn backend.main:app \
            --host 127.0.0.1 --port 8000 \
            >/tmp/nexora-backend.log 2>&1 &
          for n in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8000/v1/health >/tmp/nexora-health.json; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nexora-backend.log
          exit 1
      - name: Start Celery worker for scheduled collection and outbox delivery
        working-directory: backend
        run: |
          nohup uv run --python 3.12 celery \
            -A backend.workers.celery_app:celery_app worker \
            --pool=solo --concurrency=1 --loglevel=INFO \
            >/tmp/nexora-celery.log 2>&1 &
          for n in $(seq 1 60); do
            if grep -qi "ready" /tmp/nexora-celery.log; then
              echo "Celery worker is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-celery.log
          exit 1
      - name: Run frontend security checks
        run: |
          npm ci
          npm run test:security
      - name: Build frontend for the local integration stack
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
        run: npm run build
      - name: Start built frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 \
            >/tmp/nexora-frontend.log 2>&1 &
          for n in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:4173/welcome >/dev/null; then
              echo "Built frontend is serving."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-frontend.log
          exit 1
      - name: Exercise the complete browser-to-database journey
        working-directory: backend
        run: uv run --python 3.12 python ../tests/e2e_browser.py
      - name: Refresh walkthrough image manifest
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("docs/walkthrough/screenshots")
          files = sorted(path for path in root.glob("*.png") if path.is_file())
          if not files:
              raise SystemExit("No browser walkthrough screenshots were generated.")
          manifest = {
              "count": len(files),
              "screenshots": [
                  {"filename": path.name, "bytes": path.stat().st_size}
                  for path in files
              ],
          }
          Path("docs/walkthrough/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Prepared manifest for {len(files)} screenshots.")
          PY
      - name: Upload screenshots, logs and database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-full-stack-walkthrough-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            docs/walkthrough/screenshots/
            /tmp/nexora-*.log
            /tmp/nexora-health.json
            /tmp/nexora-db-evidence.json
            /tmp/nexora-live-source-db-evidence.json
            /tmp/nexora-scheduled-job-db-evidence.json
      - name: Publish successful screenshots to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/screenshots docs/walkthrough/manifest.json
          if git diff --cached --quiet; then
            echo "Walkthrough images already match the successful browser run."
            exit 0
          fi
          git commit -m "Refresh Nexora walkthrough screenshots [skip ci]"
          git push origin HEAD:main
