name: Nexora Full-Stack Walkthrough

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENVIRONMENT: development
      JWT_SECRET_KEY: nexora-e2e-signing-secret-2026-only-for-isolated-ci
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:5173,http://localhost:5173
      EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-e2e
      SMTP_PASSWORD: only-for-isolated-ci
      SMTP_FROM_EMAIL: nexora@example.test
      SMTP_FROM_NAME: Nexora
      FRONTEND_URL: http://127.0.0.1:4173
      GEMINI_DISCOVERY_ENABLED: "false"
      AUTO_RENDER_ENABLED: "false"
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOT_DIR: ../docs/walkthrough/screenshots

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend security checks
        run: npm run test:security

      - name: Build frontend for the local API
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development

      - name: Install backend and browser dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python "aiosmtpd==1.4.6"
          uv run --python 3.12 playwright install --with-deps chromium

      - name: Run PostgreSQL migrations
        working-directory: backend
        run: uv run --python 3.12 alembic upgrade head

      - name: Create a trusted test certificate and start isolated email sink
        working-directory: backend
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-test-key.pem \
            -out /tmp/nexora-test-cert.pem \
            -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE"
          echo "SSL_CERT_FILE=/tmp/nexora-test-cert.pem" >> "$GITHUB_ENV"
          touch "$NEXORA_MAILBOX"
          nohup uv run --python 3.12 python tests/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-test-cert.pem --key /tmp/nexora-test-key.pem \
            --outbox "$NEXORA_MAILBOX" >/tmp/nexora-smtp.log 2>&1 &
          for i in $(seq 1 30); do
            if python -c 'import socket; s=socket.socket(); s.settimeout(1); s.connect(("127.0.0.1",2525)); s.close()' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log
          exit 1

      - name: Start FastAPI
        working-directory: backend
        run: |
          nohup uv run --python 3.12 uvicorn backend.main:app \
            --host 127.0.0.1 --port 8000 >/tmp/nexora-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health >/tmp/nexora-health.json; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nexora-api.log
          exit 1

      - name: Start Vite preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/nexora-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/welcome >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-web.log
          exit 1

      - name: Run connected browser walkthrough
        working-directory: backend
        run: uv run --python 3.12 python tests/e2e_browser.py

      - name: Build screenshot manifest
        if: success()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("docs/walkthrough/screenshots")
          assets = []
          for path in sorted(root.glob("*.png")):
              data = path.read_bytes()
              assets.append({"file": path.name, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          if len(assets) < 30:
              raise SystemExit(f"Expected at least 30 screenshots, found {len(assets)}")
          (root / "manifest.json").write_text(json.dumps({"count": len(assets), "screenshots": assets}, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared manifest for {len(assets)} screenshots")
          PY

      - name: Upload walkthrough screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-browser-walkthrough
          path: |
            docs/walkthrough/screenshots/
            /tmp/nexora-api.log
            /tmp/nexora-web.log
            /tmp/nexora-smtp.log
            /tmp/nexora-mailbox.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Publish successful walkthrough screenshots to main
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/VISUAL-PRODUCT-WALKTHROUGH.md docs/walkthrough/screenshots/
          if git diff --cached --quiet; then
            echo "Walkthrough assets have not changed."
            exit 0
          fi
          git commit -m "Publish Nexora visual product walkthrough"
          git push origin HEAD:main
