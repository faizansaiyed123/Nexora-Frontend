name: Nexora Visual Walkthrough

on:
  push:
    branches: [main, "feat/**", "audit/**"]
    paths-ignore:
      - "docs/testing/visuals/**"
      - "docs/testing/visual-manifest.json"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexora-visual-walkthrough
  cancel-in-progress: true

jobs:
  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: development
      JWT_SECRET_KEY: nexora-ci-visual-review-secret-2026-10-24-long-enough
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: nexora-ci-only
      SMTP_FROM_EMAIL: no-reply@nexora.example.test
      SMTP_FROM_NAME: Nexora CI
      FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOT_DIR: ${{ github.workspace }}/docs/testing/visuals
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: Nexora-backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "uv==0.10.0"
      - name: Install backend dependencies
        working-directory: Nexora-backend
        run: uv sync --frozen --python 3.12
      - name: Prepare PostgreSQL schema
        working-directory: Nexora-backend
        run: uv run --python 3.12 alembic upgrade head
      - name: Install Chromium
        working-directory: Nexora-backend
        run: uv run --python 3.12 playwright install --with-deps chromium
      - name: Trust isolated SMTP certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/nexora-smtp.key -out /tmp/nexora-smtp.crt -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE"
          sudo cp /tmp/nexora-smtp.crt /usr/local/share/ca-certificates/nexora-smtp.crt
          sudo update-ca-certificates
      - name: Start isolated STARTTLS inbox
        working-directory: Nexora-backend
        run: |
          uv run --python 3.12 --with aiosmtpd python scripts/test_smtp_sink.py --host 127.0.0.1 --port 2525 --cert /tmp/nexora-smtp.crt --key /tmp/nexora-smtp.key --outbox /tmp/nexora-mailbox.jsonl > /tmp/nexora-smtp.log 2>&1 &
          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 2525; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log
          exit 1
      - name: Start FastAPI against PostgreSQL and Redis
        working-directory: Nexora-backend
        run: |
          PYTHONPATH=src nohup uv run --python 3.12 uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/nexora-backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then cat /tmp/nexora-health.json; exit 0; fi
            sleep 2
          done
          cat /tmp/nexora-backend.log
          exit 1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend for the local API
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
      - name: Start frontend preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nexora-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/welcome >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-frontend.log
          exit 1
      - name: Run the connected product journey
        working-directory: Nexora-backend
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: uv run --python 3.12 python tests/test_ui_e2e.py 2>&1 | tee /tmp/nexora-ui-e2e.log
      - name: Build screenshot manifest
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("docs/testing/visuals")
          files = sorted(folder.glob("*.png"))
          if len(files) < 45:
              raise SystemExit(f"Expected at least 45 screenshots; found {len(files)}")
          Path("docs/testing/visual-manifest.json").write_text(
              json.dumps({"product": "Nexora", "count": len(files), "screenshots": [{"filename": f.name, "bytes": f.stat().st_size} for f in files]}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Captured {len(files)} walkthrough screenshots.")
          PY
      - name: Preserve diagnostic logs
        if: always()
        run: |
          mkdir -p artifacts/run-logs
          for file in /tmp/nexora-smtp.log /tmp/nexora-backend.log /tmp/nexora-frontend.log /tmp/nexora-health.json /tmp/nexora-ui-e2e.log; do
            if [ -f "$file" ]; then cp "$file" artifacts/run-logs/; fi
          done
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-visual-walkthrough
          path: |
            docs/testing/visuals/*.png
            docs/testing/visual-manifest.json
            artifacts/run-logs/*
          if-no-files-found: warn
          retention-days: 21
