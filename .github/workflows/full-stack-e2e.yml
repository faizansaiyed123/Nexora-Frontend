name: Nexora full-stack browser journey

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/walkthrough/screenshots/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexora
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: nexora-ci-only-secret-32-characters-minimum-2026
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci
      SMTP_PASSWORD: nexora-ci-only-password
      SMTP_FROM_EMAIL: noreply@nexora.test
      SMTP_FROM_NAME: Nexora CI
      FRONTEND_URL: http://127.0.0.1:4173
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      CORS_ORIGINS: "http://127.0.0.1:4173,http://localhost:4173"
      GEMINI_DISCOVERY_ENABLED: "false"
      AUTO_RENDER_ENABLED: "true"
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOTS_DIR: ../docs/walkthrough/screenshots

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out Nexora frontend
        uses: actions/checkout@v4

      - name: Check out Nexora backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          path: backend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.10.0"

      - name: Install backend dependencies and SMTP test sink dependency
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python "aiosmtpd>=1.4.6,<2"

      - name: Run database migrations
        working-directory: backend
        run: uv run --python 3.12 alembic upgrade head

      - name: Build a local STARTTLS certificate and combined trust bundle
        run: |
          mkdir -p /tmp/nexora-test-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout /tmp/nexora-test-tls/server.key \
            -out /tmp/nexora-test-tls/server.crt \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          cat /etc/ssl/certs/ca-certificates.crt /tmp/nexora-test-tls/server.crt \
            > /tmp/nexora-test-tls/ca-bundle.crt

      - name: Start the isolated SMTP inbox
        working-directory: backend
        env:
          SSL_CERT_FILE: /tmp/nexora-test-tls/ca-bundle.crt
        run: |
          nohup uv run --python 3.12 python tests/smtp_sink.py \
            --host 127.0.0.1 \
            --port 2525 \
            --cert /tmp/nexora-test-tls/server.crt \
            --key /tmp/nexora-test-tls/server.key \
            --outbox /tmp/nexora-mailbox.jsonl \
            > /tmp/nexora-smtp.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "STARTTLS CI inbox listening" /tmp/nexora-smtp.log; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log
          exit 1

      - name: Start the API connected to PostgreSQL
        working-directory: backend
        env:
          SSL_CERT_FILE: /tmp/nexora-test-tls/ca-bundle.crt
        run: |
          nohup uv run --python 3.12 uvicorn backend.main:app \
            --host 127.0.0.1 --port 8000 \
            > /tmp/nexora-api.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nexora-api.log
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the real frontend against the local API
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development

      - name: Start the frontend preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 \
            > /tmp/nexora-frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/welcome > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-frontend.log
          exit 1

      - name: Install Chromium for the real browser journey
        working-directory: backend
        run: uv run --python 3.12 python -m playwright install --with-deps chromium

      - name: Run user-to-admin full-stack journey
        working-directory: backend
        env:
          SSL_CERT_FILE: /tmp/nexora-test-tls/ca-bundle.crt
        run: uv run --python 3.12 python tests/nexora_e2e.py

      - name: Upload browser screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-full-stack-browser-evidence
          if-no-files-found: warn
          path: |
            docs/walkthrough/screenshots/
            /tmp/nexora-api.log
            /tmp/nexora-smtp.log
            /tmp/nexora-frontend.log

      - name: Publish successful walkthrough screenshots to main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/screenshots/
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "Publish Nexora walkthrough screenshots"
          git push origin HEAD:main
