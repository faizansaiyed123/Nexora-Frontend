name: Nexora Full-Stack Product Journey

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      JWT_SECRET_KEY: nexora-ci-only-random-secret-2026-not-for-production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      GEMINI_DISCOVERY_ENABLED: "false"
      NEXORA_FRONTEND_URL: http://127.0.0.1:5173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOT_DIR: ${{ github.workspace }}/docs/walkthrough/screenshots
      SSL_CERT_FILE: /tmp/nexora-smtp.crt

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --frozen --python 3.12

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: uv run --python 3.12 alembic upgrade head

      - name: Run API and database integration suite
        working-directory: backend
        env:
          EMAIL_VERIFICATION_BYPASS: "true"
        run: uv run --python 3.12 pytest -q

      - name: Install frontend and run static checks
        run: |
          npm ci
          npm run test:security

      - name: Build frontend for isolated end-to-end run
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
        run: npm run build

      - name: Install Chromium
        working-directory: backend
        run: uv run --python 3.12 python -m playwright install --with-deps chromium

      - name: Create trusted test certificate for STARTTLS inbox
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/nexora-smtp.key \
            -out /tmp/nexora-smtp.crt \
            -subj "/CN=127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign,keyEncipherment" \
            -addext "subjectAltName=IP:127.0.0.1"
          echo "NEXORA_E2E_EMAIL=market-analyst-${{ github.run_id }}@northstar.example.com" >> "$GITHUB_ENV"
          mkdir -p docs/walkthrough/screenshots

      - name: Start isolated SMTP inbox
        run: |
          nohup uv run --project backend --with aiosmtpd --python 3.12 \
            python scripts/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-smtp.crt \
            --key /tmp/nexora-smtp.key \
            --outbox /tmp/nexora-mailbox.jsonl \
            > /tmp/nexora-smtp.log 2>&1 &
          for attempt in $(seq 1 40); do
            if (echo > /dev/tcp/127.0.0.1/2525) >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/nexora-smtp.log
          exit 1

      - name: Start real FastAPI app
        working-directory: backend
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "2525"
          SMTP_USERNAME: nexora-ci
          SMTP_PASSWORD: nexora-ci-only
          SMTP_FROM_EMAIL: noreply@nexora.test
          SMTP_FROM_NAME: Nexora
          FRONTEND_URL: http://127.0.0.1:5173
          AUTO_RENDER_ENABLED: "false"
        run: |
          nohup uv run --python 3.12 uvicorn backend.main:app \
            --host 127.0.0.1 --port 8000 \
            > /tmp/nexora-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-api.log
          exit 1

      - name: Start production-built frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5173 \
            > /tmp/nexora-frontend.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/welcome >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/nexora-frontend.log
          exit 1

      - name: Run real browser-to-API-to-PostgreSQL journey
        working-directory: backend
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "2525"
          SMTP_USERNAME: nexora-ci
          SMTP_PASSWORD: nexora-ci-only
          SMTP_FROM_EMAIL: noreply@nexora.test
          SMTP_FROM_NAME: Nexora
          FRONTEND_URL: http://127.0.0.1:5173
          AUTO_RENDER_ENABLED: "false"
        run: uv run --python 3.12 python ../e2e/nexora_journey.py

      - name: Build visitor and reviewer walkthrough
        if: success()
        run: python scripts/generate_walkthrough.py

      - name: Upload browser screenshots and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-full-stack-journey-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            docs/walkthrough/screenshots/*.png
            docs/walkthrough/NEXORA-PRODUCT-WALKTHROUGH.md
            /tmp/nexora-api.log
            /tmp/nexora-frontend.log
            /tmp/nexora-smtp.log

      - name: Publish successful walkthrough captures to main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B nexora-walkthrough-publish "$GITHUB_SHA"
          git rebase origin/main
          git add docs/walkthrough/NEXORA-PRODUCT-WALKTHROUGH.md docs/walkthrough/screenshots
          if git diff --cached --quiet; then
            echo "Walkthrough screenshots and document are already current."
            exit 0
          fi
          git commit -m "docs: publish Nexora product walkthrough captures [skip ci]"
          git push origin HEAD:main
