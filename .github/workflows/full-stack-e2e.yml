name: Nexora Full-Stack Walkthrough

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/walkthrough/screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexora
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: nexora-ci-full-stack-secret-32-characters-minimum-2026
      ENVIRONMENT: development
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-test-user
      SMTP_PASSWORD: nexora-test-password
      SMTP_FROM_EMAIL: noreply@nexora.test
      SMTP_FROM_NAME: Nexora CI
      FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-mailbox.jsonl
      NEXORA_SCREENSHOT_DIR: docs/walkthrough/screenshots

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.12

      - name: Install browser and local mail sink
        run: |
          uv pip install --python backend/.venv/bin/python aiosmtpd
          uv run --project backend playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-mail.key \
            -out /tmp/nexora-mail.crt \
            -days 1 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -addext "basicConstraints=critical,CA:TRUE"

      - name: Apply database migrations
        run: uv run --project backend alembic upgrade head

      - name: Backend integration suite
        env:
          EMAIL_VERIFICATION_BYPASS: "true"
          CORS_ORIGINS: http://localhost:5173
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: uv run --project backend pytest -q backend/tests

      - name: Start isolated STARTTLS mail inbox
        run: |
          nohup backend/.venv/bin/python scripts/walkthrough/smtp_sink.py \
            --cert /tmp/nexora-mail.crt \
            --key /tmp/nexora-mail.key \
            --mailbox "$NEXORA_MAILBOX" \
            > /tmp/nexora-smtp.log 2>&1 &
          echo $! > /tmp/nexora-smtp.pid
          for attempt in $(seq 1 30); do
            if grep -q "Test inbox listening" /tmp/nexora-smtp.log; then break; fi
            sleep 1
          done
          cat /tmp/nexora-smtp.log

      - name: Start FastAPI with actual PostgreSQL and Redis
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          CORS_ORIGINS: http://127.0.0.1:4173
          ALLOWED_HOSTS: 127.0.0.1,localhost
          SSL_CERT_FILE: /tmp/nexora-mail.crt
        run: |
          nohup uv run --project backend uvicorn backend.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/nexora-api.log 2>&1 &
          echo $! > /tmp/nexora-api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health > /tmp/nexora-health.json; then break; fi
            sleep 1
          done
          cat /tmp/nexora-health.json
          curl -fsS http://127.0.0.1:8000/v1/health

      - name: Build frontend for the local API
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
        run: npm run build

      - name: Start frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 \
            > /tmp/nexora-frontend.log 2>&1 &
          echo $! > /tmp/nexora-frontend.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/welcome > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/welcome > /dev/null

      - name: Run real browser-to-API-to-PostgreSQL walkthrough
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          CORS_ORIGINS: http://127.0.0.1:4173
          ALLOWED_HOSTS: 127.0.0.1,localhost
          SSL_CERT_FILE: /tmp/nexora-mail.crt
        id: walkthrough
        run: uv run --project backend python scripts/walkthrough/full_stack.py

      - name: Upload browser walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-walkthrough-screenshots
          path: docs/walkthrough/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish successful walkthrough screenshots
        if: github.ref == 'refs/heads/main' && success() && steps.walkthrough.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/screenshots
          if git diff --cached --quiet; then
            echo "Screenshot set unchanged; no asset commit needed."
            exit 0
          fi
          git commit -m "Refresh Nexora walkthrough screenshots [skip ci]"
          git push
