name: Nexora full-stack visual journey

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/walkthrough/**"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JWT_SECRET_KEY: "nexora-e2e-only-secret-key-32-characters-minimum"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/nexora"
      REDIS_URL: "redis://localhost:6379/0"
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      CORS_ORIGINS: "http://127.0.0.1:4173,http://localhost:4173"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      SMTP_HOST: "127.0.0.1"
      SMTP_PORT: "2525"
      SMTP_USERNAME: "nexora-e2e"
      SMTP_PASSWORD: "nexora-e2e-only"
      SMTP_FROM_EMAIL: "noreply@nexora.test"
      SMTP_FROM_NAME: "Nexora"
      FRONTEND_URL: "http://127.0.0.1:4173"
      NEXORA_FRONTEND_URL: "http://127.0.0.1:4173"
      NEXORA_API_URL: "http://127.0.0.1:8000"
      NEXORA_MAILBOX: "/tmp/nexora-mailbox.jsonl"
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install uv and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --project backend --frozen --python 3.12

      - name: Install browser
        run: uv run --project backend playwright install --with-deps chromium

      - name: Install and build the frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BUILD_MODE: development
        run: |
          npm ci
          npm run build

      - name: Apply PostgreSQL schema
        run: uv run --project backend alembic upgrade head

      - name: Create and trust ephemeral STARTTLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-e2e.key \
            -out /tmp/nexora-e2e.crt \
            -days 2 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -addext "basicConstraints=critical,CA:TRUE"
          sudo install -m 0644 /tmp/nexora-e2e.crt /usr/local/share/ca-certificates/nexora-e2e.crt
          sudo update-ca-certificates

      - name: Start isolated email inbox, API and web application
        run: |
          nohup uv run --project backend python backend/scripts/test_smtp_server.py \
            --host 0.0.0.0 --port 2525 \
            --cert /tmp/nexora-e2e.crt --key /tmp/nexora-e2e.key \
            --outbox "$NEXORA_MAILBOX" >/tmp/nexora-smtp.log 2>&1 &
          cd backend
          nohup uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 \
            >/tmp/nexora-api.log 2>&1 &
          cd ..
          nohup npm run preview -- --host 0.0.0.0 --port 4173 \
            >/tmp/nexora-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/v1/health >/tmp/nexora-health.json \
              && curl --silent --fail http://127.0.0.1:4173/welcome >/dev/null; then
              cat /tmp/nexora-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Application services did not become healthy."
          cat /tmp/nexora-smtp.log || true
          cat /tmp/nexora-api.log || true
          cat /tmp/nexora-frontend.log || true
          exit 1

      - name: Walk through the real application
        run: uv run --project backend python backend/scripts/e2e_visual_journey.py

      - name: Upload browser screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-visual-journey-${{ github.run_id }}
          path: |
            docs/walkthrough/screenshots/
            /tmp/nexora-health.json
            /tmp/nexora-smtp.log
            /tmp/nexora-api.log
            /tmp/nexora-frontend.log
            /tmp/nexora-mailbox.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Publish walkthrough screenshots to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough/
          if git diff --cached --quiet; then
            echo "Walkthrough screenshots are already current."
          else
            git commit -m "Refresh Nexora product walkthrough screenshots"
            git push origin HEAD:main
          fi
