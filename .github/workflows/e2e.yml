name: Nexora full-stack browser walkthrough

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/testing/visuals/nexora/**"
      - "docs/testing/VISUAL-TEST-WALKTHROUGH.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET_KEY: test-only-nexora-ci-key-9e42edb4-7a1f-4981
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "false"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
      ALLOWED_HOSTS: "*"
      CORS_ORIGINS: http://127.0.0.1:4173
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USERNAME: nexora-ci-inbox
      SMTP_PASSWORD: nexora-ci-inbox-password
      SMTP_FROM_EMAIL: noreply@nexora.example.com
      SMTP_FROM_NAME: Nexora Test Inbox
      FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_FRONTEND_URL: http://127.0.0.1:4173
      NEXORA_API_URL: http://127.0.0.1:8000
      NEXORA_MAILBOX: /tmp/nexora-ci-mailbox.jsonl
      SSL_CERT_FILE: /tmp/nexora-ci/smtp-cert.pem
      VITE_API_URL: http://127.0.0.1:8000
      VITE_API_BUILD_MODE: development
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: Nexora-Frontend
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: Nexora-backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Nexora-Frontend/package-lock.json
      - name: Install backend project
        working-directory: Nexora-backend
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python aiosmtpd
      - name: Install Chromium and system dependencies
        working-directory: Nexora-backend
        run: uv run --python 3.12 playwright install --with-deps chromium
      - name: Generate a trusted local SMTP certificate
        run: |
          mkdir -p /tmp/nexora-ci
          openssl req -x509 -nodes -days 2 -newkey rsa:2048 \
            -keyout /tmp/nexora-ci/smtp-key.pem \
            -out /tmp/nexora-ci/smtp-cert.pem \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1"
      - name: Start disposable STARTTLS inbox
        working-directory: Nexora-backend
        run: |
          nohup .venv/bin/python ../Nexora-Frontend/e2e/smtp_sink.py \
            --host 127.0.0.1 --port 2525 \
            --cert /tmp/nexora-ci/smtp-cert.pem \
            --key /tmp/nexora-ci/smtp-key.pem \
            --outbox /tmp/nexora-ci-mailbox.jsonl \
            >/tmp/nexora-ci/smtp.log 2>&1 &
          for i in $(seq 1 30); do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1',2525),1); s.close()" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat /tmp/nexora-ci/smtp.log
      - name: Install frontend dependencies
        working-directory: Nexora-Frontend
        run: npm ci
      - name: Run frontend security checks
        working-directory: Nexora-Frontend
        run: npm run test:security
      - name: Build frontend for the local API
        working-directory: Nexora-Frontend
        run: npm run build
      - name: Apply PostgreSQL migrations
        working-directory: Nexora-backend
        run: uv run --python 3.12 alembic upgrade head
      - name: Run PostgreSQL-backed API integration tests
        working-directory: Nexora-backend
        run: uv run --python 3.12 pytest -q
      - name: Start real FastAPI backend
        working-directory: Nexora-backend
        run: |
          nohup .venv/bin/python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/nexora-ci/api.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8000/v1/health >/tmp/nexora-ci/health.json; then
              cat /tmp/nexora-ci/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexora-ci/api.log
          exit 1
      - name: Start frontend preview
        working-directory: Nexora-Frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 \
            >/tmp/nexora-ci/frontend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:4173/welcome >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-ci/frontend.log
          exit 1
      - name: Run browser → API → PostgreSQL walkthrough
        working-directory: Nexora-Frontend
        run: ../Nexora-backend/.venv/bin/python e2e/run_browser_walkthrough.py
      - name: Publish verified screenshots to main
        if: success() && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        working-directory: Nexora-Frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/visuals/nexora docs/testing/VISUAL-TEST-WALKTHROUGH.md
          if ! git diff --cached --quiet; then
            git commit -m "Add Nexora walkthrough screenshots"
            git push origin HEAD:main
          fi
      - name: Upload screenshots and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-e2e-${{ github.run_id }}
          path: |
            Nexora-Frontend/docs/testing/visuals/nexora/
            /tmp/nexora-ci/api.log
            /tmp/nexora-ci/frontend.log
            /tmp/nexora-ci/smtp.log
            /tmp/nexora-ci/health.json
          if-no-files-found: warn
          retention-days: 30
