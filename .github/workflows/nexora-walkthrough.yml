name: Nexora Product Walkthrough

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/testing/visuals/**"
      - "docs/testing/VISUAL-TEST-WALKTHROUGH.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  product-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: nexora-ci-only-signing-secret-32-characters-minimum
      ENVIRONMENT: development
      EMAIL_VERIFICATION_BYPASS: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "100"
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
      RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/Nexora-backend
          ref: main
          path: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend security checks
        run: npm run test:security

      - name: Build the real frontend for the isolated API
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_API_BUILD_MODE: development

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.10.0"

      - name: Install backend and browser dependencies
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv run --python 3.12 playwright install --with-deps chromium

      - name: Migrate the disposable PostgreSQL database
        working-directory: backend
        run: uv run --python 3.12 alembic upgrade head

      - name: Run backend API integration suite
        working-directory: backend
        run: uv run --python 3.12 pytest -q

      - name: Start isolated STARTTLS inbox and application servers
        shell: bash
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          RATE_LIMIT_LOGIN_PER_MINUTE: "100"
          RATE_LIMIT_REGISTER_PER_HOUR: "100"
          RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
          RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
          SMTP_HOST: localhost
          SMTP_PORT: "2525"
          SMTP_USERNAME: nexora-ci
          SMTP_PASSWORD: nexora-ci-test-password
          SMTP_FROM_EMAIL: no-reply@nexora.test
          SMTP_FROM_NAME: Nexora Review Inbox
          FRONTEND_URL: http://localhost:4173
          CORS_ORIGINS: http://localhost:4173
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexora"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$RUNNER_TEMP/nexora/smtp.key" \
            -out "$RUNNER_TEMP/nexora/smtp.crt" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE"
          sudo cp "$RUNNER_TEMP/nexora/smtp.crt" /usr/local/share/ca-certificates/nexora-ci-smtp.crt
          sudo update-ca-certificates
          nohup bash -c 'cd backend && uv run --python 3.12 --with aiosmtpd python scripts/smtp_sink.py --host 0.0.0.0 --port 2525 --cert "$1" --key "$2" --outbox "$3"' _ \
            "$RUNNER_TEMP/nexora/smtp.crt" "$RUNNER_TEMP/nexora/smtp.key" "$RUNNER_TEMP/nexora/mailbox.jsonl" \
            > "$RUNNER_TEMP/nexora/smtp.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nexora/smtp.pid"
          nohup bash -c 'cd backend && EMAIL_VERIFICATION_BYPASS=false SMTP_HOST=localhost SMTP_PORT=2525 SMTP_USERNAME=nexora-ci SMTP_PASSWORD=nexora-ci-test-password SMTP_FROM_EMAIL=no-reply@nexora.test SMTP_FROM_NAME="Nexora Review Inbox" FRONTEND_URL=http://localhost:4173 CORS_ORIGINS=http://localhost:4173 RATE_LIMIT_LOGIN_PER_MINUTE=100 RATE_LIMIT_REGISTER_PER_HOUR=100 RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR=100 RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR=100 uv run --python 3.12 uvicorn backend.main:app --host 0.0.0.0 --port 8000' \
            > "$RUNNER_TEMP/nexora/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nexora/api.pid"
          nohup npm run preview -- --host 0.0.0.0 --port 4173 \
            > "$RUNNER_TEMP/nexora/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nexora/frontend.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/v1/health >/dev/null && curl -fsS http://localhost:4173/welcome >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/v1/health
          curl -fsS http://localhost:4173/welcome >/dev/null
          cat "$RUNNER_TEMP/nexora/smtp.log"

      - name: Run real browser-to-API-to-PostgreSQL walkthrough
        working-directory: backend
        env:
          EMAIL_VERIFICATION_BYPASS: "false"
          RATE_LIMIT_LOGIN_PER_MINUTE: "100"
          RATE_LIMIT_REGISTER_PER_HOUR: "100"
          RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: "100"
          RATE_LIMIT_RESEND_VERIFICATION_PER_HOUR: "100"
          NEXORA_FRONTEND_URL: http://localhost:4173
          NEXORA_API_URL: http://localhost:8000
          NEXORA_MAILBOX: \${{ runner.temp }}/nexora/mailbox.jsonl
          NEXORA_SCREENSHOTS_DIR: \${{ github.workspace }}/docs/testing/visuals
        run: uv run --python 3.12 python scripts/run_browser_journey.py

      - name: Store browser evidence even if a step failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-product-walkthrough-\${{ github.run_number }}
          path: |
            docs/testing/visuals/
            \${{ runner.temp }}/nexora/api.log
            \${{ runner.temp }}/nexora/smtp.log
            \${{ runner.temp }}/nexora/frontend.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish walkthrough screenshots and guide to main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/visuals docs/testing/VISUAL-TEST-WALKTHROUGH.md
          if git diff --cached --quiet; then
            echo "Walkthrough screenshots already match main."
            exit 0
          fi
          git commit -m "Add Nexora product walkthrough screenshots"
          git push origin HEAD:main
